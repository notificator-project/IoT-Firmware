<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Notificator ESP32-C3 SuperMini wiring schematic</title>
  <desc id="description">An SSD1306 OLED connects to 3.3 volts, ground, GPIO20 for SDA, and GPIO21 for SCL. A TTP223 capacitive sensor connects to 3.3 volts, ground, and GPIO0 for its digital output.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102044" flood-opacity=".12"/>
    </filter>
    <style>
      .title{font:700 32px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#10182b}
      .subtitle{font:500 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#53627c}
      .card-title{font:700 21px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#10182b}
      .card-subtitle{font:500 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#62708a}
      .pin{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#10182b}
      .pin-light{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fff}
      .label{font:650 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263550}
      .small{font:500 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#62708a}
      .wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .node{stroke:#fff;stroke-width:3}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f6f8fc"/>
  <circle cx="1090" cy="80" r="180" fill="#2d6bea" opacity=".08"/>
  <circle cx="70" cy="720" r="190" fill="#2d6bea" opacity=".06"/>

  <text x="48" y="58" class="title">Notificator Base</text>
  <text x="48" y="87" class="subtitle">ESP32-C3 SuperMini · SSD1306 128×64 OLED · TTP223 capacitive touch</text>

  <!-- OLED module -->
  <g filter="url(#shadow)">
    <rect x="48" y="132" width="330" height="238" rx="24" fill="#fff"/>
  </g>
  <text x="76" y="172" class="card-title">SSD1306 OLED</text>
  <text x="76" y="197" class="card-subtitle">128×64 · I²C address 0x3C</text>
  <rect x="76" y="220" width="184" height="116" rx="14" fill="#10213d"/>
  <rect x="87" y="231" width="162" height="94" rx="8" fill="#070b13"/>
  <text x="278" y="240" class="pin">VCC</text>
  <text x="278" y="276" class="pin">GND</text>
  <text x="278" y="312" class="pin">SDA</text>
  <text x="278" y="348" class="pin">SCL</text>
  <circle cx="354" cy="235" r="7" fill="#ef4444" class="node"/>
  <circle cx="354" cy="271" r="7" fill="#1f2937" class="node"/>
  <circle cx="354" cy="307" r="7" fill="#16a34a" class="node"/>
  <circle cx="354" cy="343" r="7" fill="#2563eb" class="node"/>

  <!-- Touch module -->
  <g filter="url(#shadow)">
    <rect x="48" y="430" width="330" height="218" rx="24" fill="#fff"/>
  </g>
  <text x="76" y="470" class="card-title">TTP223 touch sensor</text>
  <text x="76" y="495" class="card-subtitle">The device’s only physical control</text>
  <circle cx="153" cy="563" r="55" fill="#fff1f1" stroke="#ef4444" stroke-width="3"/>
  <circle cx="153" cy="563" r="39" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="153" y="569" text-anchor="middle" class="label" fill="#b91c1c">TOUCH</text>
  <text x="278" y="532" class="pin">VCC</text>
  <text x="278" y="568" class="pin">GND</text>
  <text x="278" y="604" class="pin">OUT</text>
  <circle cx="354" cy="527" r="7" fill="#ef4444" class="node"/>
  <circle cx="354" cy="563" r="7" fill="#1f2937" class="node"/>
  <circle cx="354" cy="599" r="7" fill="#f59e0b" class="node"/>

  <!-- Shared power rails -->
  <path d="M354 235 H420 V527 H354" class="wire" stroke="#ef4444"/>
  <path d="M420 235 H486" class="wire" stroke="#ef4444"/>
  <circle cx="420" cy="235" r="7" fill="#ef4444" class="node"/>
  <path d="M354 271 H446 V563 H354" class="wire" stroke="#1f2937"/>
  <path d="M446 271 H486" class="wire" stroke="#1f2937"/>
  <circle cx="446" cy="271" r="7" fill="#1f2937" class="node"/>

  <!-- Signal wires -->
  <path d="M354 307 H486" class="wire" stroke="#16a34a"/>
  <path d="M354 343 H462 V379 H486" class="wire" stroke="#2563eb"/>
  <path d="M354 599 H456 V610 H794" class="wire" stroke="#f59e0b"/>

  <!-- ESP32-C3 -->
  <g filter="url(#shadow)">
    <rect x="486" y="132" width="308" height="516" rx="28" fill="#111827"/>
  </g>
  <rect x="570" y="212" width="180" height="246" rx="20" fill="#263550" stroke="#8290a9" stroke-width="2"/>
  <rect x="590" y="242" width="140" height="174" rx="12" fill="#d6dce7"/>
  <text x="660" y="310" text-anchor="middle" class="card-title">ESP32-C3</text>
  <text x="660" y="338" text-anchor="middle" class="label">SuperMini</text>
  <text x="660" y="371" text-anchor="middle" class="small">4 MB flash</text>
  <rect x="592" y="584" width="96" height="64" rx="8" fill="#c7ced9"/>
  <rect x="609" y="598" width="62" height="50" rx="5" fill="#747f91"/>

  <!-- Relevant board pins -->
  <circle cx="486" cy="235" r="8" fill="#ef4444" class="node"/>
  <circle cx="486" cy="271" r="8" fill="#1f2937" class="node"/>
  <circle cx="486" cy="307" r="8" fill="#16a34a" class="node"/>
  <circle cx="486" cy="379" r="8" fill="#2563eb" class="node"/>
  <circle cx="794" cy="610" r="8" fill="#f59e0b" class="node"/>
  <text x="506" y="240" class="pin-light">3V3</text>
  <text x="506" y="276" class="pin-light">GND</text>
  <text x="506" y="312" class="pin-light">GPIO20</text>
  <text x="506" y="384" class="pin-light">GPIO21</text>
  <text x="665" y="615" class="pin-light">GPIO0 · TOUCH</text>

  <!-- Wiring reference -->
  <g filter="url(#shadow)">
    <rect x="842" y="132" width="310" height="516" rx="24" fill="#fff"/>
  </g>
  <rect x="842" y="132" width="310" height="70" rx="24" fill="#1f56db"/>
  <path d="M842 178 V202 H1152 V178" fill="#1f56db"/>
  <text x="872" y="175" class="card-title" style="fill:#fff">Verified connections</text>

  <text x="872" y="235" class="label">OLED</text>
  <text x="872" y="266" class="pin">VCC</text>
  <text x="960" y="266" class="small">→</text>
  <text x="1000" y="266" class="pin">3V3</text>
  <text x="872" y="299" class="pin">GND</text>
  <text x="960" y="299" class="small">→</text>
  <text x="1000" y="299" class="pin">GND</text>
  <text x="872" y="332" class="pin" fill="#16803a">SDA</text>
  <text x="960" y="332" class="small">→</text>
  <text x="1000" y="332" class="pin">GPIO20</text>
  <text x="872" y="365" class="pin" fill="#1f56db">SCL</text>
  <text x="960" y="365" class="small">→</text>
  <text x="1000" y="365" class="pin">GPIO21</text>

  <line x1="872" y1="397" x2="1122" y2="397" stroke="#dce2ec" stroke-width="2"/>
  <text x="872" y="435" class="label">TTP223</text>
  <text x="872" y="466" class="pin">VCC</text>
  <text x="960" y="466" class="small">→</text>
  <text x="1000" y="466" class="pin">3V3</text>
  <text x="872" y="499" class="pin">GND</text>
  <text x="960" y="499" class="small">→</text>
  <text x="1000" y="499" class="pin">GND</text>
  <text x="872" y="532" class="pin" fill="#a16207">OUT</text>
  <text x="960" y="532" class="small">→</text>
  <text x="1000" y="532" class="pin">GPIO0</text>

  <rect x="870" y="566" width="254" height="58" rx="12" fill="#eef4ff"/>
  <text x="887" y="590" class="small">All grounds are shared.</text>
  <text x="887" y="611" class="small">Power both modules from 3.3 V.</text>

  <text x="48" y="708" class="small">Connection schematic. Confirm the silkscreen on your exact ESP32-C3 SuperMini board before powering the device.</text>
</svg>
