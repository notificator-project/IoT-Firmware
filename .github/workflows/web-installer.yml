name: Publish firmware web installer

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ESP32_PACKAGE_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  ESP32_CORE_VERSION: 3.3.8
  FQBN: esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs,FlashSize=4M

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          source_version="$(sed -n 's/^#define FW_VERSION "\([^"]*\)"/\1/p' models/notificator_base/notificator_base.ino)"
          release_version="${RELEASE_TAG#v}"
          if [[ "$source_version" != "$release_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match firmware version $source_version." >&2
            exit 1
          fi

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_PACKAGE_URL"
          arduino-cli core install "esp32:esp32@$ESP32_CORE_VERSION" --additional-urls "$ESP32_PACKAGE_URL"
          arduino-cli lib install \
            "WiFiManager@2.0.17" \
            "PubSubClient@2.8" \
            "ArduinoJson@7.4.3" \
            "Adafruit GFX Library@1.12.6" \
            "Adafruit SSD1306@2.5.16"

      - name: Compile complete factory image
        run: |
          arduino-cli compile \
            --additional-urls "$ESP32_PACKAGE_URL" \
            --fqbn "$FQBN" \
            --output-dir build/notificator-base \
            models/notificator_base

      - name: Prepare versioned release assets
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          cp build/notificator-base/notificator_base.ino.bin \
            "build/notificator-base/notificator-base-${version}.ota.bin"
          cp build/notificator-base/notificator_base.ino.merged.bin \
            "build/notificator-base/notificator-base-${version}.factory.bin"

      - name: Attach firmware binaries to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "build/notificator-base/notificator-base-${version}.ota.bin" \
            "build/notificator-base/notificator-base-${version}.factory.bin" \
            --clobber

      - name: Assemble web installer
        run: |
          chmod +x scripts/prepare-web-installer.sh
          scripts/prepare-web-installer.sh \
            build/notificator-base/notificator_base.ino.merged.bin \
            _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
